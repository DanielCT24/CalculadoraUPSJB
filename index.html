<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Académico | Medicina Humana</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <h1>Predictor Académico</h1>
      </div>

      <div class="metrics-bar">
        <div class="metric-box">
          <span class="m-tag">Ciclo Activo</span>
          <span class="m-val" id="kpiCurrentAvg">--</span>
          <span class="merit-badge" id="kpiCurrentMerit">--</span>
        </div>
        <div class="metric-box highlight">
          <span class="m-tag">Histórico</span>
          <span class="m-val" id="kpiHistAvg">--</span>
          <span class="merit-badge" id="kpiHistMerit">--</span>
        </div>
      </div>
    </header>

    <!-- Zona de Pegado Directo de Texto de Intranet -->
    <section class="paste-zone">
      <textarea 
        id="rawPasteInput" 
        rows="2" 
        placeholder="Pega aquí el texto copiado de tu intranet (ej. BASES MOLECULARES... PC1... EP...)"
      ></textarea>
      <button class="btn btn-red" onclick="processPastedText()">Importar Notas</button>
    </section>

    <!-- Barra de Selección de Ciclo -->
    <div class="cycle-strip">
      <label for="cycleSelect">Ciclo</label>
      <select id="cycleSelect"></select>
    </div>

    <!-- Lista de Asignaturas -->
    <main id="coursesList" class="courses-flow"></main>
  </div>

  <!-- Modal Desglose PCs (+) -->
  <div class="modal-layer" id="subgradeModal">
    <div class="modal-card">
      <div class="modal-top">
        <div>
          <h3 id="modalEvalTitle">Desglose</h3>
          <span class="modal-sub" id="modalCourseTitle"></span>
        </div>
        <button class="modal-x" onclick="closeSubgradeModal()">&times;</button>
      </div>

      <div class="modal-grid">
        <div class="field">
          <label>Examen 1</label>
          <input type="number" id="subE1" min="0" max="20" step="0.1" placeholder="--" oninput="validateScale(this)">
        </div>
        <div class="field">
          <label>Examen 2</label>
          <input type="number" id="subE2" min="0" max="20" step="0.1" placeholder="--" oninput="validateScale(this)">
        </div>
        <div class="field">
          <label>Actividad 1</label>
          <input type="number" id="subA1" min="0" max="20" step="0.1" placeholder="--" oninput="validateScale(this)">
        </div>
        <div class="field">
          <label>Actividad 2</label>
          <input type="number" id="subA2" min="0" max="20" step="0.1" placeholder="--" oninput="validateScale(this)">
        </div>
      </div>

      <div class="modal-result">
        <span>Promedio:</span>
        <strong id="modalCalculatedAvg">--</strong>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="clearSubgrades()">Limpiar</button>
        <button class="btn btn-red" onclick="saveSubgrades()">Aplicar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
